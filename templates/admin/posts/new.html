{% extends "admin/layout.html" %}

{% block title %}{{ t.page_new_post }}{% endblock %}
{% block page_title %}{{ t.page_new_post }}{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post" action="/admin/posts" data-markdown-editor>
      <div class="form-group">
        <label class="form-label">{{ t.form_title }}</label>
        <input type="text" name="title" class="form-input" required autofocus>
      </div>
      <div class="form-group">
        <div class="editor-grid">
          <div class="editor-col">
            <label class="form-label">{{ t.form_content }}</label>
            <textarea name="content" class="form-textarea" required data-markdown-input></textarea>
          </div>
          <div class="editor-col">
            <label class="form-label">{{ t.form_preview }}</label>
            <div class="preview-pane" data-markdown-preview></div>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <a href="/admin/posts" class="btn btn-secondary">{{ t.form_cancel }}</a>
        <button type="submit" class="btn btn-primary">{{ t.form_save }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
