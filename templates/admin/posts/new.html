{% extends "admin/layout.html" %}

{% block title %}Nowy post{% endblock %}
{% block page_title %}Nowy post{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post" action="/admin/posts">
      <div class="mb-3">
        <label class="form-label">Tytuł</label>
        <input type="text" name="title" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Treść (Markdown)</label>
        <textarea name="content" class="form-control" rows="14" required></textarea>
      </div>
      <div class="d-flex gap-2">
        <a href="/admin/posts" class="btn btn-outline-secondary">Anuluj</a>
        <button type="submit" class="btn btn-primary">Zapisz</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
