<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<button class="mobile-toggle" id="sidebar-toggle">&#9776;</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Admin</div>
    <ul class="sidebar-nav">
      <li><a href="/admin/posts" class="active">{{ t.nav_posts }}</a></li>
    </ul>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
      <div>{% block page_actions %}{% endblock %}</div>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  document.querySelectorAll("[data-markdown-editor]").forEach(function(editor) {
    var textarea = editor.querySelector("[data-markdown-input]");
    var preview = editor.querySelector("[data-markdown-preview]");
    if (!textarea || !preview || !window.marked) return;

    function render() {
      var text = textarea.value.trim();
      if (text === "") {
        preview.innerHTML = '<span class="preview-placeholder">{{ t.form_preview_placeholder }}</span>';
      } else {
        preview.innerHTML = window.marked.parse(text, { gfm: true });
      }
    }

    textarea.addEventListener("input", render);
    render();
  });

  var toggle = document.getElementById("sidebar-toggle");
  var sidebar = document.getElementById("sidebar");
  var overlay = document.getElementById("sidebar-overlay");

  function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("open");
  }

  toggle.addEventListener("click", function() {
    sidebar.classList.toggle("open");
    overlay.classList.toggle("open");
  });

  overlay.addEventListener("click", closeSidebar);
</script>
</body>
</html>
