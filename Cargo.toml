[package]
name = "hello-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
askama = "0.14.0"
tower-http = { version = "0.6.6", features = ["fs"] }
base64 = "0.22"
dotenvy = "0.15"
tokio-postgres = "0.7.15"
pulldown-cmark = "0.13.0"

[dev-dependencies]
tower = "0.5.2"
