<!doctype html>
<html lang="pl" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Admin – {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css">
  <style>
    :root {
      color-scheme: dark;
      accent-color: #d4d4d4;
      --tblr-blue: #e5e7eb;
      --tblr-blue-rgb: 229, 231, 235;
      --tblr-primary: #e5e7eb;
      --tblr-primary-rgb: 229, 231, 235;
      --tblr-secondary: #9ca3af;
      --tblr-secondary-rgb: 156, 163, 175;
      --tblr-link-color: #f3f4f6;
      --tblr-link-color-rgb: 243, 244, 246;
      --tblr-border-color: rgba(255, 255, 255, 0.12);
      --tblr-body-bg: #050505;
      --tblr-body-color: #f5f5f5;
      --tblr-muted: #a3a3a3;
      --tblr-focus-ring-color: rgba(255, 255, 255, 0.12);
      --tblr-card-border-color: rgba(255, 255, 255, 0.08);
      --tblr-card-cap-bg: rgba(255, 255, 255, 0.02);
    }

    * {
      scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
    }

    html,
    body {
      min-height: 100vh;
      color: #f5f5f5;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.05), transparent 28%),
        linear-gradient(180deg, #0b0b0b 0%, #050505 100%);
    }

    body,
    .wrapper {
      overflow-x: hidden;
    }

    a {
      color: #f3f4f6;
      text-decoration: none;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: #fafafa;
    }

    .page-wrapper {
      min-height: 100vh;
      background: transparent;
    }

    .page-body {
      padding-bottom: 2rem;
    }

    .navbar-vertical {
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      background:
        linear-gradient(180deg, rgba(20, 20, 20, 0.96) 0%, rgba(8, 8, 8, 0.98) 100%);
      backdrop-filter: blur(16px);
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.03);
    }

    .card,
    .table,
    .form-control,
    .form-select {
      background-color: rgba(18, 18, 18, 0.92);
      color: #f5f5f5;
    }

    .card,
    .table,
    .form-control,
    .form-select,
    .table th,
    .table td {
      border-color: rgba(255, 255, 255, 0.08);
    }

    .card {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .card-body {
      padding: 1.5rem;
    }

    .navbar-brand a,
    .nav-link,
    .page-title,
    .form-label,
    .table {
      color: #f5f5f5;
    }

    .nav-link:hover,
    .nav-link:focus,
    a:hover,
    a:focus {
      color: #ffffff;
    }

    .navbar-brand {
      width: 100%;
      margin: 0 0 1.5rem;
    }

    .navbar-brand a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 3.5rem;
      padding: 0.85rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .navbar-nav {
      gap: 0.5rem;
    }

    .nav-link {
      padding: 0.9rem 1rem;
      border: 1px solid transparent;
      border-radius: 18px;
      background: transparent;
      transition: all 0.18s ease;
    }

    .nav-link:hover,
    .nav-link:focus,
    .nav-link.active {
      border-color: rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .text-muted,
    .text-secondary {
      color: #a3a3a3 !important;
    }

    .page-header {
      padding: 1.5rem 0 1rem;
    }

    .page-header .row {
      margin: 0;
      padding: 1.2rem 1.35rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      background: rgba(17, 17, 17, 0.74);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
    }

    .page-title {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 1.8rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .btn-primary {
      border-color: #d4d4d4;
      background: linear-gradient(180deg, #f5f5f5 0%, #d4d4d4 100%);
      color: #0a0a0a;
    }

    .btn-primary:hover,
    .btn-primary:focus,
    .btn-primary:active {
      border-color: #ffffff !important;
      background: #ffffff !important;
      color: #000000 !important;
    }

    .btn {
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: all 0.18s ease;
    }

    .btn-sm {
      border-radius: 999px;
    }

    .btn-outline-secondary {
      border-color: rgba(255, 255, 255, 0.2);
      color: #e5e5e5;
    }

    .btn-outline-secondary:hover,
    .btn-outline-secondary:focus,
    .btn-outline-secondary:active {
      border-color: rgba(255, 255, 255, 0.28) !important;
      background: rgba(255, 255, 255, 0.08) !important;
      color: #ffffff !important;
    }

    .btn-outline-danger {
      border-color: rgba(255, 255, 255, 0.2);
      color: #d4d4d4;
    }

    .btn-outline-danger:hover,
    .btn-outline-danger:focus,
    .btn-outline-danger:active {
      border-color: rgba(255, 255, 255, 0.28) !important;
      background: rgba(255, 255, 255, 0.08) !important;
      color: #ffffff !important;
    }

    .form-label {
      margin-bottom: 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bdbdbd;
    }

    .form-control,
    .form-select {
      min-height: 3.25rem;
      padding: 0.9rem 1rem;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(14, 14, 14, 0.94);
    }

    textarea.form-control {
      min-height: auto;
      line-height: 1.6;
      resize: vertical;
    }

    .form-control::placeholder,
    .form-select::placeholder {
      color: #71717a;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: rgba(255, 255, 255, 0.24);
      box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.08);
    }

    .table-responsive {
      border-radius: 24px;
    }

    .table {
      margin-bottom: 0;
    }

    .table thead th {
      padding-top: 1rem;
      padding-bottom: 1rem;
      color: #a3a3a3;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.025);
    }

    .table td {
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    .table tbody tr {
      transition: background-color 0.18s ease;
    }

    .table tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .editor-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .markdown-preview {
      min-height: 100%;
      border: 1px solid var(--tblr-border-color);
      border-radius: var(--tblr-border-radius-lg);
      background: rgba(10, 10, 10, 0.9);
    }

    .markdown-preview-body {
      min-height: 24rem;
      padding: 1rem 1.25rem;
    }

    .markdown-preview-body > :first-child {
      margin-top: 0;
    }

    .markdown-preview-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-preview-body pre {
      padding: 0.875rem 1rem;
      border-radius: var(--tblr-border-radius);
      background: rgba(22, 22, 22, 0.96);
      overflow-x: auto;
    }

    .markdown-preview-body code {
      color: #e5e5e5;
    }

    .markdown-preview-body blockquote {
      margin: 1rem 0;
      padding-left: 1rem;
      border-left: 2px solid rgba(255, 255, 255, 0.14);
      color: #d4d4d4;
    }

    .markdown-preview-body table {
      width: 100%;
      margin-bottom: 0;
    }

    .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.12);
      color: #f5f5f5;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
    }

    .navbar-toggler:focus {
      box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.08);
    }

    @media (min-width: 992px) {
      .navbar-vertical {
        width: 17rem;
      }

      .navbar-vertical .container-fluid {
        height: 100vh;
        padding: 1.25rem 1rem;
        align-items: stretch;
        overflow: hidden;
      }

      .navbar-vertical .navbar-collapse {
        display: block !important;
        flex: 1 1 auto;
        overflow: visible !important;
        max-height: none !important;
        scrollbar-width: none;
      }

      .navbar-vertical .navbar-collapse::-webkit-scrollbar {
        display: none;
      }
    }

    @media (max-width: 991.98px) {
      .page-header {
        padding-top: 1rem;
      }

      .page-header .row {
        padding: 1rem;
      }

      .card {
        border-radius: 20px;
      }

      .editor-grid {
        grid-template-columns: 1fr;
      }

      .markdown-preview-body {
        min-height: 18rem;
      }
    }
  </style>
</head>
<body class="antialiased">
<div class="wrapper">
  <aside class="navbar navbar-vertical navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <h1 class="navbar-brand navbar-brand-autodark">
        <a href="/admin/posts">Admin</a>
      </h1>
      <div class="collapse navbar-collapse" id="navbar-menu">
        <ul class="navbar-nav pt-lg-3">
          <li class="nav-item">
            <a class="nav-link active" href="/admin/posts">
              <span class="nav-link-title">Posty</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </aside>
  <div class="page-wrapper">
    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row g-2 align-items-center">
          <div class="col">
            <h2 class="page-title">{% block page_title %}{% endblock %}</h2>
          </div>
          <div class="col-auto ms-auto d-print-none">
            {% block page_actions %}{% endblock %}
          </div>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div class="container-xl">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/js/tabler.min.js"></script>
<script>
  document.querySelectorAll("[data-markdown-editor]").forEach((editorRoot) => {
    const textarea = editorRoot.querySelector("[data-markdown-input]");
    const preview = editorRoot.querySelector("[data-markdown-preview]");

    if (!textarea || !preview || !window.marked) {
      return;
    }

    const renderPreview = () => {
      if (textarea.value.trim() === "") {
        preview.innerHTML = '<p class="text-secondary mb-0">Podglad markdowna pojawi sie tutaj.</p>';
        return;
      }

      preview.innerHTML = window.marked.parse(textarea.value, {
        gfm: true
      });
    };

    textarea.addEventListener("input", renderPreview);
    renderPreview();
  });
</script>
</body>
</html>
